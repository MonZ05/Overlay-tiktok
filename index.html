<!doctype html><html lang="es"><head><meta charset="utf-8"><title>MonZ Overlay</title>
<meta name="viewport" content="width=1080,height=1920">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Inter','Segoe UI',system-ui,sans-serif;font-weight:800}
#root{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:top left}
.zona{position:absolute;left:0;width:1080px;display:flex;flex-direction:column;align-items:center}
#top{top:40px}#bot{bottom:40px}
.titulo{height:130px;margin-bottom:10px;display:flex;align-items:center;justify-content:center}
.titulo .fl{flex-direction:row}
.titulo img{max-height:130px;max-width:900px;filter:drop-shadow(0 0 14px rgba(212,160,23,.8))}
.titulo span{font-size:64px;letter-spacing:3px;color:#FFD54A;text-transform:uppercase;text-shadow:0 0 18px #D4A017,0 4px 0 #000,0 0 3px #000;-webkit-text-stroke:2px #000;paint-order:stroke fill}
.grid{display:flex;flex-wrap:wrap;justify-content:center;width:1040px;row-gap:14px}
.it{width:208px;position:relative;animation:entra .65s cubic-bezier(.2,1.4,.4,1) both}
.it.sale,.titulo.sale{animation:sale .5s ease-in both}
.titulo{animation:entraT .7s cubic-bezier(.2,1.3,.4,1) both}
@keyframes entra{from{opacity:0;transform:translateY(60px) scale(.4) rotate(-6deg)}to{opacity:1;transform:none}}
@keyframes entraT{from{opacity:0;transform:translateY(-50px) scale(.7)}to{opacity:1;transform:none}}
@keyframes sale{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-50px) scale(.4) rotate(6deg)}}
@keyframes flota{0%,100%{transform:translateY(0) rotate(-.6deg)}50%{transform:translateY(-8px) rotate(.6deg)}}
.fl{display:flex;flex-direction:column;align-items:center;animation:flota 3.6s ease-in-out infinite}
.titulo .fl{animation-duration:4.4s}
.im{width:158px;height:158px;display:flex;align-items:center;justify-content:center}
.im img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 0 10px rgba(255,200,60,.85)) drop-shadow(0 5px 6px rgba(0,0,0,.8))}
.sn{font-size:26px;color:#FFD54A;text-align:center;line-height:1.05;padding:0 6px;text-shadow:0 2px 4px #000,0 0 3px #000;-webkit-text-stroke:1px #000;paint-order:stroke fill}
.nom{font-size:21px;color:#fff;margin-top:2px;max-width:200px;text-align:center;line-height:1.1;text-shadow:0 2px 4px #000,0 0 3px #000;-webkit-text-stroke:1px #000;paint-order:stroke fill}
.pr{margin-top:4px;display:flex;align-items:center;gap:6px;padding:5px 18px;border-radius:999px;font-size:35px;color:#1a1100;background:linear-gradient(180deg,#FFE27A,#E8A800 55%,#B87900);border:3px solid #fff3b8;box-shadow:0 0 16px rgba(255,190,30,.9),0 5px 8px rgba(0,0,0,.6);white-space:nowrap}
.pr img{height:34px}
.x{position:absolute;top:-4px;right:12px;min-width:50px;padding:2px 10px;text-align:center;border-radius:999px;font-size:30px;color:#fff;background:linear-gradient(180deg,#ff5c5c,#c40000);border:3px solid #fff;box-shadow:0 0 14px rgba(255,60,60,.9),0 3px 6px rgba(0,0,0,.7);-webkit-text-stroke:1px #600;paint-order:stroke fill}
</style></head><body><div id="root"><div class="zona" id="top"></div><div class="zona" id="bot"></div></div>
<script>
const BASE='http://127.0.0.1:3000';const U=u=>(u&&u[0]==='/'?BASE+u:u);
let D=null,iT=0,iB=0,timer=null;
const NOMBRES={permanentes:'Frutas Permanentes',skins:'Skins',fisicas:'Frutas Físicas',gamepasses:'Gamepasses',robux:'Robux'};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PRE=new Map(); // imágenes siempre en memoria: no se vuelven a descargar ni salen "a pedazos"
function pre(u){u=U(u);if(!u)return Promise.resolve();if(!PRE.has(u)){const i=new Image();i.src=u;PRE.set(u,{i,p:(i.decode?i.decode():Promise.resolve()).catch(()=>{})})}return PRE.get(u).p}
function precarga(){if(!D)return Promise.resolve();const u=[D.titulos.icono,...Object.values(D.titulos)];for(const k in D.sec)for(const x of D.sec[k])u.push(x.img);return Promise.all(u.map(pre))}
const espera=ms=>new Promise(r=>setTimeout(r,ms));
function fallo(i,n){const s=document.createElement('span');s.className='sn';s.textContent=n;i.replaceWith(s)}
function paginas(slots){const out=[];for(const s of slots){const it=(D.sec[s]||[]);for(let i=0;i<it.length;i+=10)out.push({slot:s,items:it.slice(i,i+10)})}return out}
function precio(p){const c=D.cfg;let ic='';if(c.icono==='emoji'&&c.emoji)ic='<span>'+esc(c.emoji)+'</span>';else if(c.icono==='imagen'&&D.titulos.icono)ic='<img src="'+U(D.titulos.icono)+'">';return '<div class="pr">'+ic+'<span>'+esc(p)+'</span></div>'}
function pinta(el,pg){
  if(!pg){el.innerHTML='';return}
  const t=D.titulos[pg.slot];
  el.innerHTML='<div class="titulo"><div class="fl">'+(t?'<img src="'+U(t)+'">':'<span>'+NOMBRES[pg.slot]+'</span>')+'</div></div><div class="grid">'+
  pg.items.map((x,i)=>'<div class="it" style="animation-delay:'+(120+i*70)+'ms"><div class="fl" style="animation-delay:-'+((i*0.7)%3.6).toFixed(1)+'s"><div class="im">'+(x.img?'<img src="'+esc(U(x.img))+'" onerror="fallo(this,\''+esc(x.nombre).replace(/'/g,'')+'\')">':'<span class="sn">'+esc(x.nombre)+'</span>')+'</div>'+(D.cfg.nombres?'<div class="nom">'+esc(x.nombre)+'</div>':'')+(x.precio?precio(x.precio):'')+(x.cant>=2?'<div class="x">x'+x.cant+'</div>':'')+'</div></div>').join('')+'</div>';
}
function ajusta(){ // encaja 1080x1920 dentro del recuadro que dé TikTok, centrado y sin recortes
  const root=document.getElementById('root'),e=((D&&D.cfg.escala)||100)/100;
  const k=Math.min(innerWidth/1080,innerHeight/1920)*e;
  root.style.transform='translate('+((innerWidth-1080*k)/2)+'px,'+((innerHeight-1920*k)/2)+'px) scale('+k+')';
}
addEventListener('resize',ajusta);
function ciclo(){
  const top=paginas(['permanentes']);let bot=paginas(['skins','fisicas','gamepasses','robux']);
  ajusta();
  const a=document.getElementById('top'),b=document.getElementById('bot');
  const pt=top.length?top[iT%top.length]:null,pb=bot.length?bot[iB%bot.length]:null;iT++;iB++;
  const lista=()=>{const u=[];for(const g of [pt,pb])if(g){u.push(D.titulos[g.slot]);g.items.forEach(x=>u.push(x.img))}return Promise.race([Promise.all(u.map(pre)),espera(4000)])};
  const nuevo=()=>{pinta(a,pt);pinta(b,pb)};
  const viejos=[...document.querySelectorAll('.it,.titulo')];
  if(!viejos.length){lista().then(nuevo);return}
  document.querySelectorAll('.zona').forEach(z=>{z.querySelectorAll('.titulo').forEach(e=>e.classList.add('sale'));z.querySelectorAll('.it').forEach((e,i)=>{e.style.animationDelay=(i*50)+'ms';e.classList.add('sale')})});
  Promise.all([espera(1100),lista()]).then(nuevo);
}
async function carga(){try{const r=await fetch(BASE+'/overlay/api/datos',{cache:'no-store'});D=await r.json();precarga()}catch(e){}}
async function inicio(){await carga();await Promise.race([precarga(),espera(5000)]);ciclo();const seg=()=>((D&&D.cfg.segundos)||10)*1000;
  (function tick(){timer=setTimeout(async()=>{await carga();ciclo();tick()},seg())})();}
inicio();
</script></body></html>
